name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate site
        run: |
          set -e
          test -f index.html
          test -f css/base.css
          test -f css/theme.css
          test -f css/features.css
          test -f js/core/color.js
          test -f js/app.js
          test -f data/qqtq-480.js
          test -f data/hanter-620.js
          test -f data/alice-1680.js
          test -f guide.html
          test -f css/guide.css
          grep -q 'js/app.js' index.html
          grep -q 'css/base.css' index.html
          node --check js/core/color.js
          node --check data/qqtq-480.js
          node --check data/hanter-620.js
          node --check data/alice-1680.js
          node --check js/app.js
          python - <<'PY'
          from pathlib import Path
          import json

          def read_palette(path, var):
              s = Path(path).read_text(encoding='utf-8')
              prefix = f'window.{var}='
              if prefix not in s:
                  raise SystemExit(f'Cannot find {var} in {path}')
              payload = s.split(prefix, 1)[1].rsplit(';', 1)[0]
              return json.loads(payload)

          sakura = read_palette('data/qqtq-480.js', 'PALETTE_RAW')
          hanter = read_palette('data/hanter-620.js', 'PALETTE_HANTER_RAW')
          alice = read_palette('data/alice-1680.js', 'PALETTE_ALICE_RAW')

          assert len(sakura) == 600 and sakura[-1][0] == 'TQ600'
          assert len(hanter) == 620
          hcodes = {x[0] for x in hanter}
          assert {'001', '300', '401', '720'} <= hcodes
          assert not ({'301', '350', '400'} & hcodes)
          assert len(alice) == 1680

          html = Path('index.html').read_text(encoding='utf-8')
          if '<style>' in html:
              raise SystemExit('Inline styles should not be present after the v3.1 refactor')
          print('palette counts:', len(sakura), len(hanter), len(alice))
          print('index.html bytes:', len(html.encode('utf-8')))
          print('app.js bytes:', Path('js/app.js').stat().st_size)
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
