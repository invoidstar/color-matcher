name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate site
        run: |
          set -e
          test -f index.html
          test -f css/base.css
          test -f css/theme.css
          test -f css/features.css
          test -f js/core/color.js
          test -f js/app.js
          test -f data/qqtq-480.js
          test -f data/hanter-620.js
          test -f data/alice-1680.js
          test -f guide.html
          test -f css/guide.css
          grep -q 'js/app.js' index.html
          grep -q 'css/base.css' index.html
          node --check js/core/color.js
          node --check data/qqtq-480.js
          node --check data/hanter-620.js
          node --check data/alice-1680.js
          node --check js/app.js
